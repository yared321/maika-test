<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Camera controller module structure</title>
<desc>face_scan_camera_controller.js as a composition root: two external callers (flow controller, recording controller) call into it from above, it contains five internal modules (stream, align loop, record loop, overlay fx, detection utils), and it depends on three external modules below (quality checks, mesh renderer, warmup).</desc>
