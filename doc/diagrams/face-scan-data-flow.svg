<svg width="680" height="752" viewBox="0 0 680 752" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Face scan data flow pipeline</title>
<desc>Six sequential stages from app init through camera alignment, quality-gated recording, stop/blob event, upload, to the rendered result, with a feedback loop from recording back to alignment on a major quality failure.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<line x1="340" y1="96" x2="340" y2="160" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="216" x2="340" y2="280" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="336" x2="340" y2="400" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="456" x2="340" y2="520" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="576" x2="340" y2="640" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M140,308 L104,308 L104,188 L140,188" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-amber)"/>
<text x="94" y="248" text-anchor="end" font-family="sans-serif" font-size="12" fill="#85510b">&#8635; on abort</text>

<g>
<rect x="140" y="40" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">App init</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">demo.js + face_scan/flow_controller.js</text>
</g>

<g>
<rect x="140" y="160" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Align &amp; countdown</text>
<text x="340" y="196" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">camera_stream.js + align_loop.js</text>
</g>

<g>
<rect x="140" y="280" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="298" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Recording (quality-gated)</text>
<text x="340" y="316" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">recording_controller.js + record_loop.js</text>
</g>

<g>
<rect x="140" y="400" width="400" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Stop &#8594; blob event</text>
<text x="340" y="436" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">onstop handler + flow_controller bridge</text>
</g>

<g>
<rect x="140" y="520" width="400" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="538" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Upload</text>
<text x="340" y="556" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">upload_controller.js + service.js</text>
</g>

<g>
<rect x="140" y="640" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="658" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Result rendered</text>
<text x="340" y="676" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">emotion_score_controller.js</text>
</g>

<rect x="160" y="720" width="12" height="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="178" y="726" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Start / end</text>
<rect x="290" y="720" width="12" height="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="308" y="726" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Camera processing</text>
<rect x="460" y="720" width="12" height="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="478" y="726" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Event / upload</text>
</svg>
